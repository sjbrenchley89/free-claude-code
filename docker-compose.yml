version: '3.8'

services:
  fcc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free-claude-code
    ports:
      - "8082:8082"
    env_file:
      - .env.production
    environment:
      # Override any env vars if needed
      FCC_PORT: "8082"
      FCC_HOST: "0.0.0.0"
      # Enable server auto-start (optional)
      FCC_ENABLE_SERVER: "true"
    volumes:
      # Mount config file (optional, read-only)
      - .env.production:/app/.env.production:ro
      # Optionally mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - fcc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: fcc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - fcc-network
    depends_on:
      - fcc-server

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fcc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - fcc-network
    depends_on:
      - prometheus

networks:
  fcc-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
